[project]
name = "vision-ops-object-detection"
version = "1.0.0"
description = "Real-time object, crowd-density and fire/smoke detection with OpenCV DNN + FastAPI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
